name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, pdo_mysql, mbstring
      - run: composer install --no-interaction --prefer-dist
      - run: find app bootstrap config database routes public -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan route:list
